<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>PRIMO EURO — un attimo…</title>
<!-- Rete di sicurezza. Per una ventina di minuti (il 30/7/2026) l'app è
     stata qui in /app e la radice ospitava il sito: qualche telefono ha
     ancora in memoria quella versione e i suoi link puntano qui. Questa
     pagina li riporta all'app vera, alla radice, aggiungendo un numero
     sempre diverso all'indirizzo: così il browser non può rispondere con
     la copia vecchia che ha in tasca e riscarica la pagina fresca. -->
<script>
(function () {
  var q = location.search.replace(/^\?/, "");
  location.replace("../?" + (q ? q + "&" : "") + "aggiorna=" + Date.now());
})();
</script>
<meta http-equiv="refresh" content="1;url=../" />
<style>body{background:#05050a;color:#f5f4ef;font-family:system-ui;display:grid;place-items:center;min-height:100vh;margin:0}</style>
</head>
<body><p>Un attimo, ti porto all'app…</p></body>
</html>
